[project]
name = "agent-hub"
version = "2.0.0"
description = "Persistent multi-agent control plane"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    # Web Push (away-from-browser notifications). Pulls cryptography, http-ece,
    # py-vapid and requests. Imported lazily in app.push so its DeprecationWarnings
    # never reach pytest's error filter.
    "pywebpush>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
agent-hub = "cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One loop for the whole run. The app deliberately uses module-level singletons
# (db pool, event broker, engine), and asyncio primitives bind to the first loop
# that touches them — a loop per test would make those singletons unusable and
# stop mirroring how the service actually runs.
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
# So `.venv/bin/pytest` works as well as `python -m pytest`. The console script,
# unlike `-m`, does not put the invocation directory on sys.path, and the package
# is not installed into the venv — without this, `import app` fails in conftest
# depending only on how the suite was started.
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning"]

[tool.setuptools]
packages = ["app", "app.api", "app.orchestrator", "app.migrations"]

[tool.setuptools.package-data]
"app.migrations" = ["*.sql"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
