<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Hub</title>
<style>
:root{--bg:#f4f5f1;--panel:#fff;--ink:#1b2621;--muted:#718078;--line:#dce3dc;--green:#17533e;--soft:#e8f1ea;--red:#a83d36}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.rail{background:#173f31;color:#e9f3eb;padding:22px 14px}.brand{font-size:18px;font-weight:800;padding:0 10px 28px}.brand span{color:#bce46c}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#b9cdc0;text-align:left;padding:11px 12px;border-radius:7px;cursor:pointer;font-weight:600}.nav button.active,.nav button:hover{background:#2a5b49;color:#fff}.rail-footer{position:fixed;bottom:18px;color:#9ab4a4;font-size:11px;padding:0 10px}.main{min-width:0}.top{height:66px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 30px;gap:14px}.top h1{font-size:18px;margin:0}.top .spacer{flex:1}.button{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px;border-radius:7px;cursor:pointer;font-weight:650}.button.primary{background:var(--green);color:#fff;border-color:var(--green)}.page{padding:30px;max-width:1180px}.muted{color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-size:10px;font-weight:800}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:20px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:17px}.stat{font-size:26px;font-weight:800;margin-top:7px}.list{display:grid;gap:8px;margin-top:18px}.row{background:#fff;border:1px solid var(--line);border-radius:9px;padding:14px;display:flex;align-items:center;gap:13px}.row:hover{border-color:#9db6a4}.row-main{min-width:0;flex:1}.row-title{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-meta{font-size:12px;color:var(--muted);margin-top:5px}.pill{font-size:10px;text-transform:uppercase;padding:4px 7px;border-radius:5px;background:var(--soft);color:var(--green);font-weight:800}.pill.red{background:#f8e7e5;color:var(--red)}.empty{padding:40px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:10px}.job-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px}.timeline{display:grid;gap:10px;margin-top:16px}.event{background:#fff;border:1px solid var(--line);border-radius:9px;padding:13px}.event-head{display:flex;gap:8px;align-items:center;font-size:12px}.event-head span{margin-left:auto;color:var(--muted);font-size:11px}.event-body{white-space:pre-wrap;margin-top:8px;color:#3e4c44}.agents{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.agent{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px}.agent h3{margin:0 0 5px}.agent small{color:var(--muted)}textarea,input,select{font:inherit;border:1px solid var(--line);border-radius:7px;background:#fff;padding:10px;width:100%}.dialog{max-width:600px;background:#fff;border-radius:12px;padding:22px}.modal{position:fixed;inset:0;background:#10251dcc;display:none;place-items:center;padding:20px}.modal.open{display:grid}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}@media(max-width:800px){.app{grid-template-columns:1fr}.rail{position:sticky;top:0;z-index:5;padding:10px;display:flex;align-items:center;gap:12px}.brand{padding:0;font-size:15px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:8px}.rail-footer{display:none}.top{padding:0 16px}.page{padding:18px}.cards{grid-template-columns:1fr 1fr}.job-layout{grid-template-columns:1fr}.agents{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="rail"><div class="brand"><span>⌁</span> Agent Hub</div><nav class="nav"><button data-view="jobs" onclick="view('jobs')">Jobs</button><button data-view="agents" onclick="view('agents')">Agents</button><button data-view="artifacts" onclick="view('artifacts')">Artifacts</button><button data-view="settings" onclick="view('settings')">Settings</button></nav><div class="rail-footer">Control plane online</div></aside><main class="main"><header class="top"><h1 id="title">Jobs</h1><div class="spacer"></div><button class="button primary" onclick="openNew()">+ New job</button></header><section id="page" class="page"></section></main></div><div id="modal" class="modal"><div class="dialog"><h2>Start a new job</h2><p class="muted">The lead will coordinate the default delivery team.</p><textarea id="task" rows="6" placeholder="Describe the outcome you need..."></textarea><div style="margin-top:12px"><label class="eyebrow">Execution mode</label><select id="mode"><option value="controlled">Controlled</option><option value="yolo">YOLO</option></select></div><div class="modal-foot"><button class="button" onclick="closeNew()">Cancel</button><button class="button primary" onclick="createJob()">Start job</button></div></div></div>
<script>
const $=id=>document.getElementById(id),base=location.pathname.startsWith('/hub')?'/hub':'';let jobs=[],current=null,events=[];const names={project_lead:'Project Lead',researcher:'Researcher',builder:'Builder',reviewer:'Reviewer',tester:'Tester'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const t=x=>new Date((x||Date.now()/1000)*1000).toLocaleString();
async function load(){jobs=await fetch(base+'/api/runs').then(r=>r.json());view(location.hash.slice(1)||'jobs')};function nav(v){document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===v))};function view(v){location.hash=v;nav(v);$('title').textContent=v[0].toUpperCase()+v.slice(1);if(v==='jobs')jobsView();if(v==='agents')agentsView();if(v==='artifacts')artifactsView();if(v==='settings')settingsView();if(v==='job')jobView()}
function jobsView(){$('page').innerHTML=`<div class="eyebrow">Workspace</div><h2>Jobs</h2><p class="muted">Persistent work that can be continued from the web or CLI.</p><div class="cards"><div class="card"><div class="eyebrow">Active</div><div class="stat">${jobs.filter(x=>['queued','running'].includes(x.status)).length}</div></div><div class="card"><div class="eyebrow">Needs attention</div><div class="stat">${jobs.filter(x=>x.status==='approval-needed').length}</div></div><div class="card"><div class="eyebrow">Completed</div><div class="stat">${jobs.filter(x=>x.status==='complete').length}</div></div></div><div class="list">${jobs.length?jobs.map(j=>`<div class="row" onclick="openJob('${j.id}')"><div class="row-main"><div class="row-title">${esc(j.task)}</div><div class="row-meta">${t(j.created_at)} · ${j.id}</div></div><span class="pill ${j.status==='error'?'red':''}">${esc(j.status)}</span><span class="pill">${esc(j.mode||'controlled')}</span></div>`).join(''):'<div class="empty">No jobs yet. Start a job to begin.</div>'}</div>`}
async function openJob(id){current=await fetch(base+'/api/runs/'+id).then(r=>r.json());events=current.events||[];location.hash='job';view('job')};function jobView(){if(!current){return jobsView()}$('page').innerHTML=`<div class="eyebrow">Job ${current.id}</div><h2>${esc(current.task)}</h2><p class="muted">${current.status} · ${current.mode||'controlled'} mode · ${t(current.created_at)}</p><div style="display:flex;gap:8px;margin:16px 0"><button class="button" onclick="jobAction('pause')">Pause</button><button class="button" onclick="jobAction('resume')">Resume</button><button class="button" onclick="jobAction('stop')">Stop</button></div><div class="job-layout"><div><div class="eyebrow">Execution timeline</div><div class="timeline">${events.length?events.map(e=>`<div class="event"><div class="event-head"><b>${esc(names[e.source]||e.source||'System')}</b><span>${esc(e.kind)} · ${t(e.created_at)}</span></div><div class="event-body">${esc((e.payload||{}).content||(e.payload||{}).message||(e.payload||{}).error||JSON.stringify(e.payload||{}))}</div></div>`).join(''):'<div class="empty">Waiting for events…</div>'}</div></div><div><div class="eyebrow">Team</div><div class="list">${(current.agents||[]).map(a=>`<div class="row"><div class="row-main"><div class="row-title">${esc(names[a.agent]||a.agent)}</div><div class="row-meta">${esc(a.current_action||'Waiting')}</div></div><span class="pill">${esc(a.status)}</span></div>`).join('')}</div><div class="eyebrow" style="margin-top:22px">Artifacts</div><div class="list">${(current.artifacts||[]).map(a=>`<div class="row"><div class="row-main"><div class="row-title">${esc(a.name||'Artifact')}</div><div class="row-meta">${esc(a.mime_type||'file')}</div></div></div>`).join('')||'<div class="empty">None yet.</div>'}</div></div></div>`}
function agentsView(){$('page').innerHTML=`<div class="eyebrow">Team directory</div><h2>Agents</h2><p class="muted">Inspect the role, current state, and recent work across jobs.</p><div class="agents">${Object.entries(names).map(([id,n])=>`<div class="agent"><h3>${n}</h3><small>${id.replace('_',' ')} · provider profile inherited from job</small><p class="muted">${id==='project_lead'?'Plans, delegates, and synthesizes results.':'Specialist execution role in the default team.'}</p></div>`).join('')}</div>`};function artifactsView(){$('page').innerHTML=`<div class="eyebrow">Workspace outputs</div><h2>Artifacts</h2><p class="muted">Files and outputs remain attached to their originating job.</p><div class="list">${jobs.flatMap(j=>(j.artifacts||[]).map(a=>`<div class="row"><div class="row-main"><div class="row-title">${esc(a.name||'Artifact')}</div><div class="row-meta">${esc(j.task)} · ${esc(a.mime_type||'file')}</div></div></div>`)).join('')||'<div class="empty">Artifacts will appear here as jobs produce them.</div>'}</div>`};function settingsView(){$('page').innerHTML=`<div class="eyebrow">Configuration</div><h2>Settings</h2><p class="muted">Server-side configuration for providers and team templates.</p><div class="card" style="max-width:700px"><h3>Provider profiles</h3><p class="muted">Secrets remain on the server and are never shown in the browser.</p><div id="providers">Loading…</div><h3 style="margin-top:25px">Team templates</h3><div id="templates">Loading…</div></div>`;Promise.all([fetch(base+'/api/providers').then(r=>r.json()),fetch(base+'/api/templates').then(r=>r.json())]).then(([p,t])=>{$('providers').innerHTML=p.map(x=>`<div class="row"><div class="row-main"><div class="row-title">${esc(x.label)}</div><div class="row-meta">${esc(x.model)} · ${esc(x.base_url)}</div></div><span class="pill">${x.enabled?'enabled':'disabled'}</span></div>`).join('');$('templates').innerHTML=t.map(x=>`<div class="row"><div class="row-main"><div class="row-title">${esc(x.name)}</div><div class="row-meta">Version ${x.version}</div></div></div>`).join('')})}
async function jobAction(a){if(!current)return;await fetch(`${base}/api/runs/${current.id}/${a}`,{method:'POST'});openJob(current.id)}function openNew(){$('modal').classList.add('open');$('task').focus()}function closeNew(){$('modal').classList.remove('open')}async function createJob(){const task=$('task').value.trim();if(!task)return;const r=await fetch(base+'/api/runs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({task,mode:$('mode').value,team_id:3})}).then(r=>r.json());$('task').value='';closeNew();await load();openJob(r.id)}load();
</script></body></html>
