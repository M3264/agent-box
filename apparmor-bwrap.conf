# AppArmor profile permitting bwrap to create user namespaces.
#
# Ubuntu 24.04 ships kernel.apparmor_restrict_unprivileged_userns=1, which denies
# unprivileged user namespaces unless the binary is setuid or has a profile granting
# `userns`. bwrap is not setuid here, so without this the `sandboxed` backend fails
# every command with "bwrap: setting up uid map: Permission denied" — and agent-hub
# refuses to run the job rather than silently falling back to unconfined.
#
# flags=(unconfined) means this profile adds no confinement of its own: bwrap does
# its own sandboxing, and the only thing being granted is the capability to do it.
# Scoped to /usr/bin/bwrap, so the host-wide restriction stays in place for
# everything else — narrower than turning the sysctl off.
#
# Install (see SANDBOX.md):
#   sudo cp apparmor-bwrap.conf /etc/apparmor.d/bwrap
#   sudo apparmor_parser -r /etc/apparmor.d/bwrap

abi <abi/4.0>,
include <tunables/global>

profile bwrap /usr/bin/bwrap flags=(unconfined) {
  userns,

  include if exists <local/bwrap>
}
